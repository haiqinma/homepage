server {
    listen 80;
    server_name homepage.tidukongjian.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name homepage.tidukongjian.com;

    root /usr/share/nginx/html/tidukongjian;
    index index.html;

    access_log /var/log/nginx/homepage.access.log combined;
    error_log /var/log/nginx/homepage.error.log warn;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    ssl_certificate /etc/letsencrypt/live/homepage.tidukongjian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homepage.tidukongjian.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
